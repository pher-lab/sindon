[workspace]
resolver = "2"
members = [
    "crates/sindon",
    "crates/sindon_core",
    "crates/sindon_security",
    "crates/sindon_reactive",
    "crates/sindon_layout",
    "crates/sindon_render",
    "crates/sindon_text",
    "crates/sindon_widgets",
    "crates/sindon_platform",
    "crates/sindon_app",
    "examples/animation_demo",
    "examples/clock",
    "examples/counter",
    "examples/dialog_settings_demo",
    "examples/font_size_demo",
    "examples/form_controls_demo",
    "examples/hello_world",
    "examples/hover_demo",
    "examples/image_demo",
    "examples/knot",
    "examples/knot_clone",
    "examples/knot_spike",
    "examples/markdown_demo",
    "examples/modal_demo",
    "examples/number_input_demo",
    "examples/password_manager",
    "examples/progress_demo",
    "examples/secure_password_form",
    "examples/split_demo",
    "examples/system_demo",
    "examples/textarea_demo",
    "examples/theme_swap_demo",
    "examples/toast_demo",
    "examples/tree_demo",
    "examples/vault",
]
# The vendored cosmic-text fork is a path dependency of sindon_text, which would
# otherwise make it an automatic workspace member — and then `cargo fmt --all`,
# `clippy --workspace` and `test --workspace` would all reach into vendored
# third-party code. Keep it out.
exclude = ["third_party/cosmic-text"]

[workspace.package]
version = "0.1.3"
edition = "2024"
# Verified by the `msrv` CI job, not asserted here. This read 1.87 from the
# first release until 2026-07-28, when a `cargo add sindon` project on an older
# stable was the first thing ever to test it: cargo rejects that graph outright
# (our own sindon-cosmic-text fork needs 1.89, smol_str 1.89, image 1.88).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pher-lab/sindon"
# Inherited paths resolve from the workspace root, so all ten crates ship the
# same front page on crates.io. LICENSE-MIT and LICENSE-APACHE sit next to it.
readme = "README.md"

[workspace.dependencies]
# External
wgpu = "29"
winit = "0.30"
# Fork of cosmic-text 0.18.2, vendored under third_party/ and published under
# its own name. Two changes, each marked `// sindon fork:` in the source:
#   1. A drop-zeroize on BufferLine's plaintext buffer so SecureText's transient
#      shape path leaves no un-zeroed plaintext residue on the heap (the
#      framework's zeroize-first promise; see crates/sindon_text/src/lib.rs).
#   2. `set_rich_text` re-adds the trailing empty line that `set_text` keeps,
#      which upstream drops via `BidiParagraphs` — so the plain and rich shape
#      paths agree on line count / height / caret for text ending in a newline.
#
# ⚠ This is a *direct* dependency on purpose. It used to be a `[patch.crates-io]`
# override of the upstream crate, but `[patch]` is only read from the root
# workspace being built: it never reaches a downstream crate that depends on
# sindon from crates.io, so publishing would have silently dropped change 1 —
# the zeroize guarantee — with no in-workspace test able to notice. The `path`
# is used locally; `cargo publish` rewrites it to the registry version.
#
# The dependency key stays `cosmic-text`, so the extern name is `cosmic_text`
# and `use cosmic_text::...` keeps working unchanged across the workspace.
#
# To update: re-vendor the new upstream release into third_party/ and re-apply
# both patches, then bump this crate's own version.
cosmic-text = { package = "sindon-cosmic-text", version = "0.1", path = "third_party/cosmic-text" }
taffy = "0.9"
zeroize = { version = "1.8", features = ["derive"] }
memsec = "0.7"
slotmap = "1.0"
arboard = { version = "3", default-features = false }
log = "0.4"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
subtle = "2"
criterion = "0.5"
argon2 = "0.5"
chacha20poly1305 = "0.10"
sys-locale = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Pulled in by image; declared here only to keep 0.8.0 out of the graph.
#
# ⚠ Do not turn this back into an `=` pin. It was `=0.8.0` to dodge a
# const-eval ICE that 0.8.1 hit on rustc 1.93 — but an exact requirement is
# published verbatim into sindon_render's dependencies, where a consumer
# cannot override it (`--precise` violates the requirement, so their only
# escape is changing toolchain). Measured 2026-07-28 building a fresh
# `cargo add sindon` project: it is now *0.8.0* that ICEs 1.93
# (`defaults::PQ_LUT_TABLE`, STATUS_ACCESS_VIOLATION) while 0.8.1 compiles
# clean on 1.93 and 1.96 alike. The pin had inverted into the very failure it
# was written to prevent, and only the workspace's Cargo.lock — which is not
# published — was hiding it from us. A floor, not a pin: it excludes the
# known-bad 0.8.0 and lets each consumer's toolchain resolve upward.
moxcms = "0.8.1"
rfd = "0.15"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal
#
# Each carries both `version` and `path`: cargo builds against the path locally
# and rewrites it to the registry version when packaging. Without `version`,
# `cargo publish` refuses the crate outright ("all dependencies must have a
# version specified"), so the whole workspace is unpublishable — keep them in
# lockstep with [workspace.package] version above.
sindon_core = { version = "0.1.3", path = "crates/sindon_core" }
sindon_security = { version = "0.1.3", path = "crates/sindon_security" }
sindon_reactive = { version = "0.1.3", path = "crates/sindon_reactive" }
sindon_layout = { version = "0.1.3", path = "crates/sindon_layout" }
sindon_render = { version = "0.1.3", path = "crates/sindon_render" }
sindon_text = { version = "0.1.3", path = "crates/sindon_text" }
sindon_widgets = { version = "0.1.3", path = "crates/sindon_widgets" }
sindon_platform = { version = "0.1.3", path = "crates/sindon_platform" }
sindon_app = { version = "0.1.3", path = "crates/sindon_app" }

# Debug info is this workspace's dominant disk cost, and it is a shape problem,
# not a discipline problem: the binary count is what multiplies it. 97 test
# suites + 24 example binaries each link the full wgpu / naga / cosmic-text /
# taffy graph, and on the MSVC target every one of them gets its own PDB
# carrying that graph's debug info again.
#
# Measured 2026-08-03, before this section existed:
#   target/                       434.7 GB   (97% of the project)
#   └ debug/deps/*.pdb            304.1 GB   1,698 files, 180 MB avg, 558 MB max
#   same tree's release/deps/*.pdb  0.7 GB     208 files, 3.4 MB avg
# The 53x per-file gap is debug info and nothing else. Cargo never collects old
# artifact generations either, so every hash change since March was still on
# disk — but that is only half of it: the *current* generation alone was 173 GB,
# so periodic cleaning could never have held the line here.
#
# `line-tables-only` keeps what this project actually reads from a debug build —
# panic locations and backtrace file:line — and drops the type and variable info
# that a debugger would want. `[profile.dev.package."*"]` then zeroes it for
# everything outside the workspace, which is where the bulk lives. profile.test
# inherits from dev, so the 97 suites are covered without a separate section.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
