[workspace]
resolver = "2"
members = [
    "crates/shroud",
    "crates/shroud_core",
    "crates/shroud_security",
    "crates/shroud_reactive",
    "crates/shroud_layout",
    "crates/shroud_render",
    "crates/shroud_text",
    "crates/shroud_widgets",
    "crates/shroud_platform",
    "crates/shroud_app",
    "examples/animation_demo",
    "examples/clock",
    "examples/counter",
    "examples/dialog_settings_demo",
    "examples/font_size_demo",
    "examples/hello_world",
    "examples/hover_demo",
    "examples/image_demo",
    "examples/knot",
    "examples/knot_clone",
    "examples/knot_spike",
    "examples/markdown_demo",
    "examples/modal_demo",
    "examples/number_input_demo",
    "examples/password_manager",
    "examples/secure_password_form",
    "examples/system_demo",
    "examples/textarea_demo",
    "examples/theme_swap_demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
# External
wgpu = "29"
winit = "0.30"
cosmic-text = "0.18"
taffy = "0.9"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
memsec = "0.7"
slotmap = "1.0"
arboard = { version = "3", default-features = false }
log = "0.4"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
subtle = "2"
criterion = "0.5"
argon2 = "0.5"
chacha20poly1305 = "0.10"
sys-locale = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Pinned to 0.8.0 because 0.8.1 ICEs rustc 1.93.0 stable on the
# `defaults::PQ_LUT_TABLE` const-eval ("`is_signed` on non-scalar ABI
# ScalarPair"). image 0.25.10 requires `^0.8.0` so 0.8.0 still resolves.
# Revisit when rustc fixes the const-eval ABI bug.
moxcms = "=0.8.0"
rfd = "0.15"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal
shroud_core = { path = "crates/shroud_core" }
shroud_security = { path = "crates/shroud_security" }
shroud_reactive = { path = "crates/shroud_reactive" }
shroud_layout = { path = "crates/shroud_layout" }
shroud_render = { path = "crates/shroud_render" }
shroud_text = { path = "crates/shroud_text" }
shroud_widgets = { path = "crates/shroud_widgets" }
shroud_platform = { path = "crates/shroud_platform" }
shroud_app = { path = "crates/shroud_app" }

# Fork of cosmic-text 0.18.2 vendored under third_party/. The only change is a
# drop-zeroize on BufferLine's plaintext buffer so SecureText's transient
# shape path leaves no un-zeroed plaintext residue on the heap (the framework's
# zeroize-first promise; see crates/shroud_text/src/lib.rs). Same version as
# upstream 0.18.2 so it satisfies the `cosmic-text = "0.18"` requirement above.
# To update: re-vendor the new release into third_party/ and re-apply the patch.
[patch.crates-io]
cosmic-text = { path = "third_party/cosmic-text" }
