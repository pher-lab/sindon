[workspace]
resolver = "2"
members = [
    "crates/sindon",
    "crates/sindon_core",
    "crates/sindon_security",
    "crates/sindon_reactive",
    "crates/sindon_layout",
    "crates/sindon_render",
    "crates/sindon_text",
    "crates/sindon_widgets",
    "crates/sindon_platform",
    "crates/sindon_app",
    "examples/animation_demo",
    "examples/clock",
    "examples/counter",
    "examples/dialog_settings_demo",
    "examples/font_size_demo",
    "examples/form_controls_demo",
    "examples/hello_world",
    "examples/hover_demo",
    "examples/image_demo",
    "examples/knot",
    "examples/knot_clone",
    "examples/knot_spike",
    "examples/markdown_demo",
    "examples/modal_demo",
    "examples/number_input_demo",
    "examples/password_manager",
    "examples/progress_demo",
    "examples/secure_password_form",
    "examples/split_demo",
    "examples/system_demo",
    "examples/textarea_demo",
    "examples/theme_swap_demo",
    "examples/toast_demo",
    "examples/tree_demo",
    "examples/vault",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
# External
wgpu = "29"
winit = "0.30"
cosmic-text = "0.18"
taffy = "0.9"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
memsec = "0.7"
slotmap = "1.0"
arboard = { version = "3", default-features = false }
log = "0.4"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
subtle = "2"
criterion = "0.5"
argon2 = "0.5"
chacha20poly1305 = "0.10"
sys-locale = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Pinned to 0.8.0 because 0.8.1 ICEs rustc 1.93.0 stable on the
# `defaults::PQ_LUT_TABLE` const-eval ("`is_signed` on non-scalar ABI
# ScalarPair"). image 0.25.10 requires `^0.8.0` so 0.8.0 still resolves.
# Revisit when rustc fixes the const-eval ABI bug.
moxcms = "=0.8.0"
rfd = "0.15"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal
sindon_core = { path = "crates/sindon_core" }
sindon_security = { path = "crates/sindon_security" }
sindon_reactive = { path = "crates/sindon_reactive" }
sindon_layout = { path = "crates/sindon_layout" }
sindon_render = { path = "crates/sindon_render" }
sindon_text = { path = "crates/sindon_text" }
sindon_widgets = { path = "crates/sindon_widgets" }
sindon_platform = { path = "crates/sindon_platform" }
sindon_app = { path = "crates/sindon_app" }

# Fork of cosmic-text 0.18.2 vendored under third_party/. Two changes, each
# marked `// sindon fork:` in the source:
#   1. A drop-zeroize on BufferLine's plaintext buffer so SecureText's transient
#      shape path leaves no un-zeroed plaintext residue on the heap (the
#      framework's zeroize-first promise; see crates/sindon_text/src/lib.rs).
#   2. `set_rich_text` re-adds the trailing empty line that `set_text` keeps,
#      which upstream drops via `BidiParagraphs` — so the plain and rich shape
#      paths agree on line count / height / caret for text ending in a newline.
# Same version as upstream 0.18.2 so it satisfies the `cosmic-text = "0.18"`
# requirement above. To update: re-vendor the new release into third_party/ and
# re-apply both patches.
[patch.crates-io]
cosmic-text = { path = "third_party/cosmic-text" }
