[package]
name = "shroud_widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Widget library for the shroud UI framework"

[dependencies]
shroud_core = { workspace = true }
shroud_security = { workspace = true }
shroud_reactive = { workspace = true }
shroud_render = { workspace = true }
shroud_text = { workspace = true }
shroud_layout = { workspace = true }

[dev-dependencies]
image = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
] }
