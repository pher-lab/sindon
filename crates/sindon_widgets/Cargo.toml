[package]
name = "sindon_widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Widget library for the sindon UI framework"
license.workspace = true
repository.workspace = true

[dependencies]
sindon_core = { workspace = true }
sindon_security = { workspace = true }
sindon_reactive = { workspace = true }
sindon_render = { workspace = true }
sindon_text = { workspace = true }
sindon_layout = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
image = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "layout"
harness = false

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
] }
