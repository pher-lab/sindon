[package]
name = "shroud_app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Application framework for the shroud UI framework"

[dependencies]
shroud_core = { workspace = true }
shroud_security = { workspace = true }
shroud_reactive = { workspace = true }
shroud_render = { workspace = true }
shroud_text = { workspace = true }
shroud_layout = { workspace = true }
shroud_widgets = { workspace = true }
shroud_platform = { workspace = true }
winit = { workspace = true }
log = { workspace = true }
pollster = "0.4"
# OS accessibility (screen-reader) exposure. Pinned to the winit-0.30
# compatible line: accesskit_winit 0.33 depends on winit ^0.30.5 and
# accesskit ^0.24. These are the only crates in the workspace that link
# accesskit — the vocabulary (shroud_core) and widgets stay accesskit-free.
accesskit = "0.24"
accesskit_winit = "0.33"
