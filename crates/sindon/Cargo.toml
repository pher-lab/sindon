[package]
name = "sindon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A security-first Rust UI framework with secret zeroization guarantees"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["gui", "ui", "security", "zeroize", "desktop"]
categories = ["gui", "cryptography"]
# tests/facade_drift.rs reads the sibling crates' lib.rs to check that this
# crate still re-exports what it claims to. Those sources are not in the
# published .crate, so shipping the test would hand every consumer a suite
# that cannot pass. It is a repository gate, not a property of the artifact.
exclude = ["tests/"]

[dependencies]
sindon_core = { workspace = true }
sindon_security = { workspace = true }
sindon_reactive = { workspace = true }
sindon_render = { workspace = true }
sindon_text = { workspace = true }
sindon_layout = { workspace = true }
sindon_widgets = { workspace = true }
sindon_platform = { workspace = true }
sindon_app = { workspace = true }
