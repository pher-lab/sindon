name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info in the wgpu/winit/image static-link graph dominates target/
  # size. `cargo build --workspace --all-targets` links 18 example binaries
  # plus every crate's test binary, each statically pulling in that graph, and
  # the combined debuginfo exhausted the runner's disk/memory -- rust-lld then
  # died with "ld terminated with signal 7 [Bus error]" mid-link (the failing
  # target moved around between runs, proving it was footprint, not code).
  # Dropping debuginfo for CI shrinks each binary enough to keep headroom.
  # Local builds are unaffected (this only applies inside the workflow).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# The Rust toolchain version (and its clippy/rustfmt components) is the single
# source of truth in rust-toolchain.toml. `rustup show` reads that file and
# installs the pinned toolchain eagerly, so there is no separate setup action to
# keep in sync and no double toolchain install.

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `--all-targets` is the heaviest job (all examples + all test binaries).
      # Reclaim ~20GB of preinstalled toolchains we never use so the debug
      # target/ tree has room, as extra insurance on top of the debuginfo cut.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - run: rustup show
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace

  msrv:
    name: MSRV (declared rust-version)
    runs-on: ubuntu-latest
    # `rust-version` is a promise published into all ten crates' metadata, and
    # until 2026-07-28 nothing compiled it even once. Every other job here runs
    # the toolchain pinned in rust-toolchain.toml, so the declared floor was
    # free to drift — and it had, to 1.87, which cargo rejects outright because
    # our own cosmic-text fork needs 1.89. A consumer on a toolchain between
    # the claim and the truth is the only one who finds out.
    #
    # The version is read from the manifest rather than written here, so this
    # job cannot drift from the thing it is checking. Cargo's graph check fails
    # in seconds if the claim is impossible; the compile after it covers the
    # half that needs a real build.
    steps:
      - uses: actions/checkout@v5
      - name: Read the declared floor
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "declared rust-version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      # Scoped to the facade, which pulls in the other nine: `rust-version` is a
      # promise about the *published* crates, and the examples are not published.
      # Checking them here would also drag in knot's bundled SQLCipher/OpenSSL
      # source build for no added coverage.
      - run: cargo +${{ steps.msrv.outputs.version }} check -p sindon

  fork-propagation:
    name: Fork reaches downstream
    runs-on: ubuntu-latest
    # The sibling of the residue gate below, and deliberately a separate job so
    # its name says which half of the guarantee it covers:
    #
    #   residue (below)  — "is the fork correct?"   scans for plaintext residue
    #   this job         — "does the fork arrive?"  inspects the resolved graph
    #
    # The second question cannot be answered from inside the workspace. Cargo
    # reads `[patch]` only from the root workspace being built, so while the
    # cosmic-text fork was applied that way, every in-workspace build resolved
    # through it and stayed green — including the residue gate — while any
    # downstream consumer silently got upstream cosmic-text and lost the
    # zeroize guarantee. `ci/downstream-gate` is an independent workspace root
    # so it sees what downstream sees.
    #
    # No system deps and no rust-cache: `cargo metadata` resolves the graph
    # without compiling anything, which is what keeps this job under a minute.
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      # Invoked via `bash` rather than as ./script so the job does not depend on
      # the executable bit surviving a checkout from a Windows working copy,
      # where core.filemode is typically off.
      - name: cosmic-text fork reaches a downstream consumer
        run: bash ci/check-fork-propagation.sh

  macos:
    name: macOS (compile + test)
    runs-on: macos-latest
    # Until this job existed, no macOS compiler had ever seen this workspace.
    # CI covered ubuntu and windows; docs.rs builds on Linux. So every
    # `#[cfg(target_os = "macos")]` arm shipped to crates.io untype-checked —
    # and those arms are not stubs. `sindon_security::hardening` calls
    # `libc::ptrace` with a hard-coded `PT_DENY_ATTACH = 31`, and
    # `sindon_platform::display_protection` has its own Darwin branch: the
    # crate carrying the security promise had a platform arm nobody had
    # compiled. "It builds on macOS" was never a claim anyone had tested,
    # which is why the README now marks macOS unverified.
    #
    # One `cargo test --workspace` answers the three questions in the order
    # they can fail: the crates compile for Darwin, the example binaries link
    # against the system frameworks (an rlib-only check would not), and the
    # suite passes on a host where the selected platform arms are the macOS
    # ones — including `hardening.rs`, whose smoke test calls PT_DENY_ATTACH
    # for real. knot and vault are excluded for the same reason the residue
    # job excludes knot: they build SQLCipher with vendored OpenSSL from
    # source, they are not published, and neither contains macOS-specific
    # code. Nothing else is skipped.
    #
    # The question this job answers is "does sindon exist on macOS". It is
    # deliberately not "is it lint-clean there" (clippy would rebuild the
    # whole graph to answer a different question) and not "does it run" —
    # running needs a window server and a GPU, and gets its own steps below
    # because the answer may be about the runner rather than about sindon.
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude knot --exclude vault

      # And does it run? Both steps below are non-gating on purpose: whether a
      # hosted macOS runner can host a GPU window is a fact about the runner,
      # not about sindon, and this job's green has to keep meaning "compiles
      # and tests on macOS" until that fact is established. Promote them to
      # gating once they have proven stable — or delete them, if it turns out
      # hosted runners cannot present at all and only real hardware can answer.
      #
      # `continue-on-error` has a sharp edge: the API reports such a step with
      # `conclusion: success` even when it failed (only the separate `outcome`
      # field disagrees), so a job whose steps all read green can contain a
      # failed smoke. Both scripts therefore emit a `::warning` annotation of
      # their own on failure, the way the residue job does for an absorbed
      # flake, and still exit non-zero so the step is marked in the UI.
      #
      # The control runs first because it decides how to read the smoke. See
      # ci/macos-window-control.swift for why it draws instead of just opening
      # a window, and ci/macos-run-smoke.sh for what "survives" means.
      - name: Can this runner host a GPU window? (control)
        continue-on-error: true
        run: swift ci/macos-window-control.swift

      # Invoked via `bash` rather than as ./script for the same reason as the
      # fork-propagation job: the executable bit does not survive a checkout
      # from a Windows working copy, where core.filemode is typically off.
      - name: hello_world survives a run
        continue-on-error: true
        run: |
          cargo build -p hello_world
          bash ci/macos-run-smoke.sh target/debug/hello_world

  macos-apps:
    name: macOS (example apps)
    runs-on: macos-latest
    # The job above excludes knot and vault, and that exclusion is right for the
    # question it asks — neither is published, neither contains macOS-specific
    # Rust. But it leaves a different question unanswered, and that one has a
    # deadline attached: knot is the only thing in this repo that exercises IME,
    # the clipboard, file dialogs, Retina text and capture prevention together,
    # so it is what time on a borrowed Mac would actually be spent on. If it
    # cannot build there, the place to find that out is here — not on hardware
    # that has to go back.
    #
    # The risk lives entirely in the dependency graph rather than in our code
    # (a grep for `cfg(target_os` across examples/ returns nothing): `rusqlite`
    # with `bundled-sqlcipher-vendored-openssl` compiles SQLite, the SQLCipher
    # patch set and OpenSSL from source, and OpenSSL's configure is a Perl
    # program. That is the same build that needs Strawberry Perl first on PATH
    # on Windows — fragile enough there that the residue job below avoids it on
    # purpose. Whether Darwin's system Perl and clang satisfy it is a fact
    # nobody has tested.
    #
    # Gating, unlike the smokes: "does it compile" is a fact about this
    # workspace and its dependencies. "can a hosted runner present a GPU
    # window" is not.
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p knot -p vault

      # Its own control rather than a reference to the one in the job above:
      # that control ran on a different runner, so it is evidence about that
      # machine and not this one. Cheap enough (a single-file Swift program) to
      # be worth keeping honest.
      - name: Can this runner host a GPU window? (control)
        continue-on-error: true
        run: swift ci/macos-window-control.swift

      # What makes knot worth running in addition to hello_world is everything
      # hello_world never touches: a bundled icon font, a `Yu Gothic UI` family
      # that does not exist on macOS, SQLCipher opening a file, and
      # `capture_prevention(true)` — which on macOS reports failure through
      # `log::warn!`, and sindon installs no logger, so it is silent by
      # construction rather than by success. A clean 15 seconds here is not
      # evidence that any of that is *correct*; it is evidence that none of it
      # aborts before a human on real hardware can look at it.
      - name: knot survives a run
        continue-on-error: true
        run: bash ci/macos-run-smoke.sh target/debug/knot

  residue:
    name: Secret residue (Windows)
    runs-on: windows-latest
    # The secret-residue gates scan live process memory via the Win32 API, so
    # they are `#![cfg(windows)]` and never run on the Linux jobs above. This
    # job is their home. Scoped to the two crates that own the tests so it does
    # NOT build the knot example (its bundled-SQLCipher/OpenSSL build needs
    # Strawberry Perl first on PATH, which is fragile on hosted runners).
    #
    # Two layers keep these whole-process memory scans honest on a shared,
    # nondeterministic hosted runner without ever weakening the residue==0
    # assertion:
    #
    #  1. `--test-threads=1` — belt-and-braces only, as of 2026-07-17. Each test
    #     walks *this whole process's* memory counting a canary, and two
    #     scanners running in parallel used to read each other's scratch buffer
    #     and count the sibling's snapshot of their own canary. That is now
    #     fixed where it belongs — the scratch is process-wide and every scan
    #     holds it, so concurrent scans cannot happen (see the `Scratch` doc in
    #     zeroize_verification.rs). Serial execution is no longer what makes
    #     these tests correct; it is kept because it costs nothing.
    #  2. Retry the run up to 3 times (fresh process each attempt). A *real*
    #     residue leak is deterministic — the plaintext is physically present
    #     every run — so it fails all three and is still caught; only
    #     runner-specific nondeterminism is absorbed. (The 2026-07 flake this
    #     used to absorb was the scanner ReadProcessMemory-ing a chunk window
    #     that overlaps its own scratch buffer — an overlapping RPM is a
    #     forward copy over its own source, smearing any canary in the sliver
    #     before the scratch into phantom matches. The scanner now hops over
    #     its scratch; see the Scanner doc in either residue test. Retry
    #     stays as cheap insurance.)
    #
    # A pass on attempt >= 2 emits a workflow warning annotation so absorbed
    # flakes stay visible instead of vanishing into the log. "Real leaks are
    # deterministic" only holds while the tested flows are single-threaded and
    # deterministic; a *rising* flake rate here is the fingerprint of a new
    # intermittent retention path (e.g. an eviction-dependent cache) that the
    # retry would otherwise silently mask — investigate, don't ignore.
    #
    # Do not remove the retry layer.
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cosmic-text fork leaves zero plaintext residue
        run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "residue attempt $i/3"
            cargo test -p sindon_text --test cosmic_residue -- --test-threads=1
            if ($LASTEXITCODE -eq 0) {
              if ($i -gt 1) {
                Write-Host "::warning title=Residue gate flaked (absorbed)::cosmic_residue passed on attempt $i/3. Retry only absorbs nondeterministic runner noise; a real leak is deterministic and fails all 3 attempts. If this warning becomes frequent, suspect a new intermittent retention path, not the runner."
              }
              exit 0
            }
          }
          exit 1
      - name: SecureInput lock flow leaves zero plaintext residue
        run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "residue attempt $i/3"
            cargo test -p sindon_widgets --test zeroize_verification -- --test-threads=1
            if ($LASTEXITCODE -eq 0) {
              if ($i -gt 1) {
                Write-Host "::warning title=Residue gate flaked (absorbed)::zeroize_verification passed on attempt $i/3. Retry only absorbs nondeterministic runner noise; a real leak is deterministic and fails all 3 attempts. If this warning becomes frequent, suspect a new intermittent retention path, not the runner."
              }
              exit 0
            }
          }
          exit 1
