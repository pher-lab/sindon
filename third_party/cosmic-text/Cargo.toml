# This file started as the normalized manifest of the crates.io release of
# cosmic-text 0.18.2 and has been modified for the sindon fork. Every sindon
# change is marked `# sindon fork:` (or `// sindon fork:` in the sources).
#
# The fork exists because sindon needs a drop-zeroize on cosmic-text's one owned
# plaintext buffer; see the `[dependencies.zeroize]` note below and
# `src/buffer_line.rs`. It is published under its own name so that the guarantee
# reaches downstream crates — a `[patch.crates-io]` entry only applies to the
# root workspace being built and would silently vanish for anyone depending on
# sindon from crates.io.
#
# To update: re-vendor the new upstream release over this directory and re-apply
# the sindon changes (`git diff` against the crates.io source shows them), then
# keep the `[package]` block below.

[package]
edition = "2021"
rust-version = "1.89"
# sindon fork: renamed so the fork can be published and depended on directly.
# `[lib] name` stays `cosmic_text` below, so the vendored sources, doctests,
# tests and benches need no edits when re-vendoring.
name = "sindon-cosmic-text"
# sindon fork: versioned independently of upstream. Tying this to upstream's
# 0.18.2 would leave no room to ship a fix to the fork itself before upstream
# moves. The upstream release this tracks is named in `description` and README.
version = "0.1.0"
authors = [
    "Jeremy Soller <jeremy@system76.com>",
    "pher-lab",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of cosmic-text 0.18.2 that zeroizes plaintext line buffers on drop, maintained for the sindon UI framework. Not affiliated with System76."
documentation = "https://docs.rs/sindon-cosmic-text"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pher-lab/sindon"

[package.metadata.docs.rs]
features = ["vi"]

[features]
default = [
    "std",
    "swash",
    "fontconfig",
]
fontconfig = [
    "fontdb/fontconfig",
    "std",
]
monospace_fallback = []
no_std = [
    "hashbrown",
    "dep:libm",
    "skrifa/libm",
    "core_maths",
]
peniko = []
shape-run-cache = []
std = [
    "fontdb/memmap",
    "fontdb/std",
    "harfrust/std",
    "linebender_resource_handle/std",
    "skrifa/std",
    "swash?/std",
    "sys-locale",
    "unicode-bidi/std",
]
vi = [
    "modit",
    "syntect",
    "cosmic_undo_2",
]
warn_on_missing_glyphs = []
wasm-web = ["sys-locale?/js"]

# sindon fork: deliberately kept as `cosmic_text` even though the package is
# now `sindon-cosmic-text`. Dependents rename via `package = ...` anyway, and
# keeping it means the vendored sources stay byte-identical to upstream apart
# from the two marked patches.
[lib]
name = "cosmic_text"
path = "src/lib.rs"

[[test]]
name = "editor_modified_state"
path = "tests/editor_modified_state.rs"

[[test]]
name = "ellipsize_rendering"
path = "tests/ellipsize_rendering.rs"

[[test]]
name = "shaping_and_rendering"
path = "tests/shaping_and_rendering.rs"

[[test]]
name = "wrap_stability"
path = "tests/wrap_stability.rs"

[[test]]
name = "wrap_word_fallback"
path = "tests/wrap_word_fallback.rs"

[[bench]]
name = "layout"
path = "benches/layout.rs"
harness = false

[[bench]]
name = "text_shaping_benchmarks"
path = "benches/text_shaping_benchmarks.rs"
harness = false

[dependencies.bitflags]
version = "2.10.0"

[dependencies.core_maths]
version = "0.1.1"
optional = true

[dependencies.cosmic_undo_2]
version = "0.2.0"
optional = true

[dependencies.fontdb]
version = "0.23"
default-features = false

[dependencies.harfrust]
version = "0.5.0"
default-features = false

[dependencies.hashbrown]
version = "0.16"
optional = true
default-features = false

[dependencies.libm]
version = "0.2.16"
optional = true

[dependencies.linebender_resource_handle]
version = "0.1.1"
default-features = false

[dependencies.log]
version = "0.4.29"

[dependencies.modit]
version = "0.1.5"
optional = true

[dependencies.rangemap]
version = "1.7.1"

[dependencies.rustc-hash]
version = "2.1.1"
default-features = false

[dependencies.self_cell]
version = "1.2.2"

[dependencies.skrifa]
version = "0.40.0"
default-features = false

[dependencies.smol_str]
version = "0.3.2"
default-features = false

[dependencies.swash]
version = "0.2.6"
features = [
    "render",
    "scale",
]
optional = true
default-features = false

[dependencies.syntect]
version = "5.3.0"
optional = true

[dependencies.sys-locale]
version = "0.3.2"
optional = true

[dependencies.unicode-bidi]
version = "0.3.18"
features = ["hardcoded-data"]
default-features = false

[dependencies.unicode-linebreak]
version = "0.1.5"

[dependencies.unicode-script]
version = "0.5.8"

[dependencies.unicode-segmentation]
version = "1.12.0"

# sindon fork: zeroize BufferLine's plaintext buffer on drop/overwrite so the
# SecureText shape path leaves no un-zeroed plaintext residue. `alloc` feature
# provides `Zeroize for String`. Kept no_std-compatible (no forced `std`).
[dependencies.zeroize]
version = "1.8"
default-features = false
features = ["alloc"]

[dev-dependencies.criterion]
version = "0.8.1"
features = ["cargo_bench_support"]
default-features = false

[dev-dependencies.tiny-skia]
version = "0.11.4"

[profile.test]
opt-level = 1
