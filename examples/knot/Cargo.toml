[package]
name = "knot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sindon = { path = "../../crates/sindon" }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
# Recovery key: BIP39 12-word mnemonic -> HKDF-SHA256 -> recovery KEK that
# wraps the DEK. Same primitives/parameters as Knot v0.7.0's crypto/recovery.rs
# so a vault stays conceptually compatible with the upstream design.
bip39 = "2.0"
hkdf = "0.12"
sha2 = "0.10"
# Non-secret settings (theme + font size) round-trip through the Phase 37
# `sindon::platform::storage` JSON helpers, which are generic over
# `Serialize`/`DeserializeOwned` — so the app supplies the derive.
serde = { workspace = true }
# Markdown preview: parse the note body into a sindon widget tree (B-2 app
# piece). Same parser + version as the `markdown_demo` spike this is lifted
# from; `default-features = false` drops the unused HTML/CLI bits.
pulldown-cmark = { version = "0.10", default-features = false }
# Open external `[text](url)` links from the markdown preview in the OS
# default handler (gap C-2). Tiny shell-out wrapper; the preview gates which
# schemes reach it (http/https/mailto only).
opener = "0.7"
# SQLCipher 4.x via rusqlite. `bundled-sqlcipher-vendored-openssl` keeps
# the toolchain fully reproducible — everything (SQLite, the SQLCipher
# patch set, and OpenSSL) builds from source so we don't depend on a
# system OpenSSL install or a vcpkg checkout. First build is slow
# (~minutes) but subsequent builds are cached.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
# Settings round-trip tests serialize directly; the app itself only needs
# serde (the storage helper owns serde_json).
serde_json = { workspace = true }
# Attachment tests generate a tiny in-memory PNG to exercise the
# seal -> store -> decrypt -> decode round-trip (the app decodes via
# `sindon::widgets::Image`, but tests need to *produce* valid image bytes).
image = { workspace = true }
